name: RAPELZ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Pasang compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang
      - name: Build dengan peringatan ketat
        env:
          CC: ${{ matrix.compiler }}
          CFLAGS: -std=c11 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror -O2
        run: make clean all
      - name: Jalankan test inti
        run: make test
      - name: Uji editor melalui pseudo-terminal
        run: make test-pty

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Build dengan AddressSanitizer dan UBSan
        run: |
          make clean
          make CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" all tests/test_completion
      - name: Jalankan test di bawah sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: make test
